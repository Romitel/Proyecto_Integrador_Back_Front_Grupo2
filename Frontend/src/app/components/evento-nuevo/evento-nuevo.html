<div class="container mx-auto" style="max-width: 42rem;">
    <h1 class="display-4 fw-bolder text-uppercase">Nuevo encuentro</h1>

    <form [formGroup]="form" (ngSubmit)="submit()" class="mt-4 rounded-3 border bg-body p-4 shadow-sm">

        <div class="row g-3 mb-3">
            <!-- Disciplina -->
            <div class="col-sm-6">
                <label for="sport" class="form-label fw-medium">Disciplina</label>
                <select id="sport" formControlName="sport" class="form-select">
                    @for (s of sports; track s) {
                    <option [value]="s">{{ s }}</option>
                    }
                </select>
            </div>

            <!-- Nombre (opcional) -->
            <div class="col-sm-6">
                <label for="title" class="form-label fw-medium">Nombre (opcional)</label>
                <input id="title" type="text" formControlName="title" placeholder="Picado de los jueves"
                    class="form-control" />
            </div>

            <!-- Fecha -->
            <div class="col-sm-6">
                <label for="date" class="form-label fw-medium">Fecha</label>
                <input id="date" type="date" formControlName="date" class="form-control" />
            </div>

            <!-- Horario -->
            <div class="col-sm-6">
                <label for="time" class="form-label fw-medium">Horario</label>
                <input id="time" type="time" formControlName="time" class="form-control" />
            </div>
        </div>

        <!-- Lugar o predio -->
        <div class="mb-3">
            <label for="location" class="form-label fw-medium">Lugar o predio (dirección)</label>
            <input id="location" type="text" formControlName="location"
                placeholder="Complejo El Potrero, Av. Siempreviva 742, CABA" class="form-control" />
        </div>

        <div class="row g-3 mb-3">
            <!-- Capacidad máxima -->
            <div class="col-sm-6">
                <label for="max" class="form-label fw-medium">Capacidad máxima</label>
                <input id="max" type="number" min="1" formControlName="max_capacity" class="form-control" />
            </div>

            <!-- Mínimo para jugar -->
            <div class="col-sm-6">
                <label for="min" class="form-label fw-medium">Mínimo para jugar</label>
                <input id="min" type="number" min="1" formControlName="min_participants" class="form-control" />
            </div>

            <!-- Modalidad -->
            <div class="col-sm-6">
                <label for="mode" class="form-label fw-medium">Modalidad</label>
                <select id="mode" formControlName="mode" class="form-select">
                    <option value="abierta">Abierta (admite invitados)</option>
                    <option value="cerrada">Cerrada (solo activos)</option>
                </select>
            </div>

            <!-- Rango de edad preferente -->
            <div class="col-sm-6">
                <label class="form-label fw-medium">Rango de edad preferente</label>
                <div class="d-flex gap-2">
                    <input type="number" placeholder="Desde" formControlName="age_min" class="form-control" />
                    <input type="number" placeholder="Hasta" formControlName="age_max" class="form-control" />
                </div>
            </div>
        </div>

        <!-- Condicional: Solo si mode === 'abierta' -->
        @if (form.get('mode')?.value === 'abierta') {
        <div class="d-flex align-items-center justify-content-between rounded-3 bg-body-secondary p-3 mb-3">
            <div>
                <div class="fw-semibold">Habilitar invitados desde ya</div>
                <div class="small text-body-secondary">Por defecto se habilitan 24 h antes del encuentro.</div>
            </div>

            <!-- Switch nativo de Bootstrap 5 -->
            <div class="form-check form-switch m-0">
                <input class="form-check-input" type="checkbox" role="switch" id="guestsSwitch"
                    formControlName="guests_enabled_early" style="width: 2.5em; height: 1.25em; cursor: pointer;" />
            </div>
        </div>
        }

        <!-- Notas -->
        <div class="mb-4">
            <label for="notes" class="form-label fw-medium">Notas</label>
            <textarea id="notes" rows="3" formControlName="notes" placeholder="Llevar camiseta clara y oscura"
                class="form-control"></textarea>
        </div>

        <!-- Botón Submit -->
        <button type="submit" [disabled]="busy" class="btn btn-primary btn-lg w-100">
            {{ busy ? 'Creando...' : 'Crear encuentro' }}
        </button>

    </form>
</div>
