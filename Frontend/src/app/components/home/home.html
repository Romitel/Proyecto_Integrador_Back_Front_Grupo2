<div class="min-vh-100">
    <!-- Hero Section -->
    <section class="position-relative overflow-hidden bg-pitch text-pitch-foreground" style="min-height: 88vh;">
        <img src="hero-pitch.jpg" alt="Cancha de fútbol iluminada de noche" width="1600" height="1008"
            class="position-absolute top-0 start-0 w-100 h-100 object-fit-cover" />

        <div class="hero-section position-relative mx-auto d-flex flex-column px-4 py-4 max-w-6xl">
            <header class="d-flex align-items-center justify-content-between">
                <app-logo></app-logo>
                <a appButton variant="pitch" size="lg" [routerLink]="targetRoute">
                    Ir a mis eventos
                </a>
            </header>
            <div class="mt-auto pb-5" style="max-width: 48rem;">
                <p
                    class="mb-3 d-inline-block rounded-pill bg-accent px-3 py-1 small fw-semibold text-uppercase tracking-widest">
                    Deportes amateurs
                </p>

                <h1 class="font-display hero-title">
                    ¿Jugás el jueves?<br />
                    <span class="text-accent">Decí ESTOY!</span>
                </h1>

                <p class="mt-4 fs-5 text-pitch-80" style="max-width: 36rem;">
                    Convocatorias, cupos y lista de espera para tu grupo. Sin contar mensajes, sin discusiones por el
                    último lugar.
                </p>

                <div class="mt-4 d-flex flex-wrap gap-3">
                    <a appButton variant="lime" size="lg" [routerLink]="targetRoute">
                        Empezar ahora
                    </a>
                </div>
            </div>
        </div>
    </section>

    <!-- Features Section -->
    <section class="chalk-lines mx-auto px-4 py-5 max-w-6xl"
        style="padding-top: 5rem !important; padding-bottom: 5rem !important;">
        <h2 class="font-display display-5 fw-bold text-uppercase">Todo el partido, ordenado</h2>

        <div class="row g-4 mt-3">
            @for (f of features; track f.title) {
            <div class="col-12 col-sm-6 col-lg-4">
                <div class="h-100 rounded-4 border bg-card p-4 shadow-card">
                    <i [class]="'bi ' + f.icon + ' fs-4 text-primary'"></i>
                    <h3 class="mt-3 h4 fw-bold">{{ f.title }}</h3>
                    <p class="mt-2 mb-0 text-muted-foreground">{{ f.text }}</p>
                </div>
            </div>
            }
        </div>
    </section>
</div>
<app-footer></app-footer>
